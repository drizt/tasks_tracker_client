name: tasks_tracker_client
description: "Tasks Tracker personal client application."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  highlight: ^0.7.0
  json_rpc_2: ^4.1.0
  markdown: ^7.3.1
  nativeapi: ^0.5.10
  nativeapi_flutter: ^0.5.10
  smart_date_formatter: ^2.4.0
  ulid: ^2.0.1
  web_socket_channel: ^3.0.3
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tray_icon.png
    - assets/tray_icon_active.png
    - assets/test_tasks.json
    - windows/runner/resources/app_icon.ico
    - windows/runner/resources/tray_icon.ico
    - windows/runner/resources/tray_icon_active.ico
