name: tasks_tracker_client
description: "Tasks Tracker personal client application."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  json_rpc_2: ^4.1.0
  nativeapi:
    path: third_party/nativeapi-flutter/packages/nativeapi
  ulid: ^2.0.1
  web_socket_channel: ^3.0.3
  window_manager: ^0.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  cnativeapi:
    path: third_party/nativeapi-flutter/packages/cnativeapi

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png
    - assets/app_icon_active.png
    - assets/test_tasks.json
    - windows/runner/resources/app_icon.ico
    - windows/runner/resources/app_icon_active.ico
